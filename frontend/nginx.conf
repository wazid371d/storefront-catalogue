server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The one rule that keeps the brief's "client never calls Fake Store API
    # directly" true in the containerised build too: every /api/* request is
    # forwarded to our backend service, never to the browser's own origin.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Vite fingerprints asset filenames per build, so these can be cached
    # aggressively — a new build simply gets new filenames.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must always be revalidated — it's the only thing that
    # points at the current fingerprinted bundle. Caching it is how a
    # browser ends up running yesterday's build after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
