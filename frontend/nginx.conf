server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The one rule that keeps the brief's "client never calls Fake Store API
    # directly" true in the containerised build too: every /api/* request is
    # forwarded to our backend service, never to the browser's own origin.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri /index.html;
    }
}
