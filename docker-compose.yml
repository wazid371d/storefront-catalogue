services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8025:8025" # web UI — view "sent" enquiry emails here
      - "1025:1025" # SMTP

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      MONGODB_URI: mongodb://mongo:27017/storefront-catalogue
      FAKE_STORE_API_BASE_URL: https://fakestoreapi.com
      PRODUCT_CACHE_TTL_SECONDS: "900"
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: enquiries@fieldstonegoods.test
      SALES_INBOX_EMAIL: sales@fieldstonegoods.test
      CORS_ORIGIN: http://localhost:3000
      RATE_LIMIT_WINDOW_MS: "60000"
      RATE_LIMIT_MAX: "20"
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mongo-data:
